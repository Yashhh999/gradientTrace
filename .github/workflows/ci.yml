name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test deps
        run: pip install numpy scikit-learn pyyaml
      - name: Byte-compile all modules
        run: python -m compileall -q gradienttrace colab tests
      - name: Metrics unit tests
        run: python tests/test_metrics.py
